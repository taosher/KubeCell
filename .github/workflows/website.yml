name: Website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://kubecell.pages.dev' }}

      - name: Verify static output
        run: |
          test -f dist/client/index.html
          test -f dist/client/404.html
          test -f dist/client/sitemap.xml
          test -f dist/client/robots.txt
          test -f dist/client/docs/index.html
          test -f dist/client/quickstart/index.html

      - name: Upload Pages artifact
        # PRs only build. Pushes and manual runs (any branch) can deploy.
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist/client
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    # Push to main => production deployment.
    # Manual run on any branch => preview deployment (--branch below).
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://kubecell.pages.dev' }}
    defaults:
      run:
        working-directory: website
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: website/dist/client

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          # Cloudflare Pages treats the production branch (main) as production
          # and every other branch name as a preview deployment.
          command: pages deploy --cwd deploy --branch=${{ github.ref_name }}
