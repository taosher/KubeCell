      <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" transform="translate(200,190)">
        <line x1="0" y1="0" x2="0" y2="-35"/>
        <line x1="0" y1="0" x2="24.7" y2="-24.7"/>
        <line x1="0" y1="0" x2="35" y2="0"/>
        <line x1="0" y1="0" x2="24.7" y2="24.7"/>
        <line x1="0" y1="0" x2="0" y2="35"/>
        <line x1="0" y1="0" x2="-24.7" y2="24.7"/>
        <line x1="0" y1="0" x2="-35" y2="0"/>
        <line x1="0" y1="0" x2="-24.7" y2="-24.7"/>
      </g>
      <circle cx="200" cy="190" r="28" fill="none" stroke="#FFFFFF" stroke-width="5.5"/>
      <circle cx="200" cy="190" r="7.5" fill="#FFFFFF"/>
