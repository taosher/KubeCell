<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1b"/>
      <stop offset="0.55" stop-color="#04060d"/>
      <stop offset="1" stop-color="#060b18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#2f7fe0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2f7fe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.92" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb6ff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <g transform="translate(80 74) scale(0.24) translate(-200 -215)">
    <g fill="#2f7fe0">
      <polygon points="200,10 246,32 200,54 154,32"/>
      <polygon points="154,40 195,61 195,106 154,85"/>
      <polygon points="246,40 205,61 205,106 246,85"/>
