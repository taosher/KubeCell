apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: kubecell
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: kubecell
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubecell-management-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: kubecell
data:
  ocm-managed-cluster-namespace-convention: {{ .Values.ocm.managedClusterNamespaceConvention | quote }}
  ocm-proxy-profile: {{ .Values.ocm.proxyProfile | quote }}
  ocm-managed-service-account-name: {{ .Values.ocm.managedServiceAccountName | quote }}
  ocm-proxy-address: {{ .Values.ocm.proxyAddress | quote }}
  ocm-host-server-name: {{ .Values.ocm.hostServerName | quote }}
  apps-suffix: {{ .Values.appsSuffix | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecell-controller
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: kubecell
    app.kubernetes.io/managed-by: kubecell
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kubecell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubecell
        app.kubernetes.io/managed-by: kubecell
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
      - name: controller
        image: {{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: KUBECELL_OCM_CLUSTER_PROXY_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: kubecell-management-config
              key: ocm-proxy-address
        - name: KUBECELL_OCM_CLUSTER_PROXY_CA_FILE
          value: /var/run/kubecell/ocm-proxy/ca.crt
        - name: KUBECELL_OCM_HOST_SERVER_NAME
          valueFrom:
            configMapKeyRef:
              name: kubecell-management-config
              key: ocm-host-server-name
        - name: KUBECELL_OCM_CLUSTER_PROXY_CLIENT_CERT_FILE
          value: /var/run/kubecell/ocm-proxy/tls.crt
        - name: KUBECELL_OCM_CLUSTER_PROXY_CLIENT_KEY_FILE
          value: /var/run/kubecell/ocm-proxy/tls.key
        - name: KUBECELL_APPS_SUFFIX
          valueFrom:
            configMapKeyRef:
              name: kubecell-management-config
              key: apps-suffix
        args:
        - --leader-elect
        - --webhook-enabled={{ .Values.webhook.enabled }}
        {{- if .Values.webhook.enabled }}
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        {{- end }}
        ports:
        - name: health
          containerPort: 8081
        - name: metrics
          containerPort: 8443
        - name: webhook
          containerPort: 9443
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.controller.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        {{- if .Values.webhook.enabled }}
        - name: webhook-certs
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
        {{- end }}
        - name: ocm-proxy-tls
          mountPath: /var/run/kubecell/ocm-proxy
          readOnly: true
      volumes:
      {{- if .Values.webhook.enabled }}
      - name: webhook-certs
        secret:
          secretName: {{ .Values.webhook.certificateSecretName }}
      {{- end }}
      - name: ocm-proxy-tls
        secret:
          secretName: {{ .Values.ocm.proxyTLS.secretName }}
          items:
          - key: {{ .Values.ocm.proxyTLS.caKey }}
            path: ca.crt
          - key: {{ .Values.ocm.proxyTLS.clientCertKey }}
            path: tls.crt
          - key: {{ .Values.ocm.proxyTLS.clientKey }}
            path: tls.key
---
apiVersion: v1
kind: Service
metadata:
  name: kubecell-controller
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: kubecell
spec:
  selector:
    app.kubernetes.io/name: kubecell
  ports:
  - name: health
    port: 8081
    targetPort: health
  - name: metrics
    port: 8443
    targetPort: metrics
{{- if .Values.webhook.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.webhook.serviceName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: kubecell
spec:
  selector:
    app.kubernetes.io/name: kubecell
  ports:
  - name: https
    port: 443
    targetPort: webhook
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kubecell-webhook-selfsigned
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: kubecell
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kubecell-webhook-cert
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: kubecell
spec:
  secretName: {{ .Values.webhook.certificateSecretName }}
  dnsNames:
  - {{ .Values.webhook.serviceName }}.{{ .Values.namespace }}.svc
  - {{ .Values.webhook.serviceName }}.{{ .Values.namespace }}.svc.cluster.local
  issuerRef:
    name: kubecell-webhook-selfsigned
    kind: Issuer
{{- end }}
