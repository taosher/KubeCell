{{- if .Values.kite.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubecell-kite-full
  labels:
    app.kubernetes.io/managed-by: kubecell
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubecell-kite-full
  labels:
    app.kubernetes.io/managed-by: kubecell
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubecell-kite-full
subjects:
- kind: ServiceAccount
  name: kubecell-kite
  namespace: {{ .Values.namespace }}
{{- end }}
