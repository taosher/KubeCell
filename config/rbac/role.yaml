---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cluster.open-cluster-management.io
  resources:
  - managedclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kubecell.io
  resources:
  - cells
  - virtualclusters
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kubecell.io
  resources:
  - cells/status
  - virtualclusterplans/status
  - virtualclusters/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - kubecell.io
  resources:
  - virtualclusterplans
  - virtualnodeclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - work.open-cluster-management.io
  resources:
  - manifestworks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
